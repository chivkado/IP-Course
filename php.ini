;;;;;;;;;;;;;;;;;;;;
; Laravel Dev Setup
;;;;;;;;;;;;;;;;;;;;

; Timezone
date.timezone = "Asia/Phnom_Penh"

; Error Handling
display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL

; File Uploads
file_uploads = On
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 50

; Execution Time
max_execution_time = 300
max_input_time = 300
memory_limit = 512M

; Output Buffering
output_buffering = 4096

; Short Open Tags
short_open_tag = Off

; Session Settings
session.gc_maxlifetime = 1440
session.save_handler = files
session.save_path = "C:\php\tmp"

; Extensions
extension_dir = "ext"

extension=curl
extension=gd
extension=mbstring
extension=mysqli
extension=pdo_mysql
extension=zip
extension=openssl  ; ✅ Important for Composer HTTPS
extension=fileinfo ; ✅ Required for file validation
extension=sodium   ; ✅ Recommended for Laravel encryption

; OPCache
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
